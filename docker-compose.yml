services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskify}
      POSTGRES_DB: ${POSTGRES_DB:-taskify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskify} -d ${POSTGRES_DB:-taskify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskify}:${POSTGRES_PASSWORD:-taskify}@postgres:5432/${POSTGRES_DB:-taskify}?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
